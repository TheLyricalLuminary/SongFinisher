name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  # Pure-Swift packages build and test on Linux. Linux runners bill at 1x and are
  # available on private repos, so this actually runs (the previous macOS-only
  # workflow failed to start on every push). Covers the lyric logic that ships to
  # every device regardless of Apple Intelligence: the syllable counter, ranker,
  # and the offline assembler including the function-word-salad guard.
  #
  # MelodyKit (AVFoundation/Accelerate) and the app target need macOS + Xcode and
  # are validated locally until macOS runners are enabled for the account.
  #
  # KNOWN RED, AND NOT FROM THIS FILE. Every run of this workflow, on every branch
  # including main, is marked failed after ~2 seconds with runner_id 0, an empty
  # runner_name, no steps recorded, and a 404 on the log download — while the same
  # package tests pass locally. That is a job no runner ever picked up, not a job
  # whose tests failed.
  #
  # Ruled out by experiment (runs #8 vs #9): removing the job-level `container:`
  # and pulling the Swift image from an ordinary step instead changed nothing —
  # identical runner_id 0 and identical 404. Job containers are set up before step
  # logging begins, so they were the one part of this file capable of failing that
  # silently, and they are not the cause. Nothing in the repository is.
  #
  # What still fits: hosted runners are unavailable to this account. Repository
  # Settings → Actions → General, and the account's billing/spending limit, are
  # where that gets resolved; a failed payment blocks Actions account-wide even on
  # a public repo, where minutes are otherwise free. The built-in Pages deployment
  # workflow does succeed, but it runs on GitHub-managed infrastructure and so does
  # not prove hosted runners are reachable for ordinary jobs.
  linux-logic-tests:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Test Domain and LyricEngine
        run: |
          set -euo pipefail
          for p in Domain LyricEngine; do
            echo "── swift test: $p ──"
            swift test --package-path "Packages/$p"
          done
