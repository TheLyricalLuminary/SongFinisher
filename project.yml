name: SongFinisher
options:
  bundleIdPrefix: com.songfinisher
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Domain:
    path: Packages/Domain
  MelodyKit:
    path: Packages/MelodyKit
  LyricEngine:
    path: Packages/LyricEngine
  PersistenceKit:
    path: Packages/PersistenceKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SongFinisher:
    type: application
    platform: iOS
    sources:
      - SongFinisher
      - Features
    dependencies:
      - package: Domain
      - package: MelodyKit
      - package: LyricEngine
      - package: PersistenceKit
      - target: SongFinisherWidgets
    info:
      path: SongFinisher/Info.plist
      properties:
        NSMicrophoneUsageDescription: >-
          Song Finisher listens to your melody on this device to suggest lyrics
          that fit it. Audio is analyzed locally and never stored.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # A locked phone must not kill a take mid-hum: capture continues in the
        # background and the Live Activity narrates it from the lock screen.
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.songfinisher.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    # Signing lives in Signing.xcconfig so it survives `xcodegen generate`, which
    # discards whatever Xcode's Signing & Capabilities tab was set to.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig

  # The Live Activity host (lock screen + Dynamic Island). Compiles the shared
  # SessionActivityAttributes so the app and the widget agree on the activity contract.
  SongFinisherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - SongFinisherWidgets
      - path: Features/LiveActivity/SessionActivityAttributes.swift
    info:
      path: SongFinisherWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.songfinisher.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
    # Same signing identity as the app — a widget that cannot sign fails the whole
    # install, even when the app itself is fine.
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig

  SongFinisherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SongFinisherTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: SongFinisher

  # Task 4 real-hardware validation target (docs/ARCHITECTURE.md real-voice testing
  # strategy): iOS Simulator has no route to external audio interfaces like the
  # Scarlett Solo — AVAudioEngine.inputNode on macOS uses the system's selected
  # input device directly (System Settings > Sound > Input), which is the only way
  # to get a real CoreAudio signal from external hardware. Shares the exact same
  # AppServices/DiagnosticCaptureView/DiagnosticCaptureViewModel sources as the iOS
  # target — nothing platform-specific to duplicate.
  SongFinisherMac:
    type: application
    platform: macOS
    sources:
      - SongFinisher
      - Features
    dependencies:
      - package: Domain
      - package: MelodyKit
      - package: LyricEngine
      - package: PersistenceKit
    info:
      path: SongFinisherMac/Info.plist
      properties:
        NSMicrophoneUsageDescription: >-
          Song Finisher listens to your melody on this device to suggest lyrics
          that fit it. Audio is analyzed locally and never stored.
        LSApplicationCategoryType: public.app-category.music
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.songfinisher.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: false
        ENABLE_HARDENED_RUNTIME: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  SongFinisher:
    build:
      targets:
        SongFinisher: all
    run:
      # Local StoreKit testing: the paywall's three products resolve from this file
      # in Xcode/simulator runs, no App Store Connect setup or paid account needed.
      storeKitConfiguration: SongFinisher.storekit
    test:
      targets:
        - SongFinisherTests

  SongFinisherMac:
    build:
      targets:
        SongFinisherMac: all
